services:
  # --- Application services, built from each service's existing Dockerfile ---
  - type: web
    name: auth-service
    runtime: docker
    rootDir: services/auth
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3001"
      - key: AUTH_PORT
        value: "3001"
      - key: AUTH_SERVICE_NAME
        value: auth
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: MONGO_URI
        value: mongodb://mongodb:27017/battery-passport

  - type: web
    name: passport-service
    runtime: docker
    rootDir: services/passport
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3002"
      - key: PASSPORT_PORT
        value: "3002"
      - key: PASSPORT_SERVICE_NAME
        value: passport
      - key: MONGO_URI
        value: mongodb://mongodb:27017/battery-passport
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: KAFKA_BROKER
        value: "kafka:9092"

  - type: web
    name: document-service
    runtime: docker
    rootDir: services/document
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3003"
      - key: DOCUMENT_PORT
        value: "3003"
      - key: DOCUMENT_SERVICE_NAME
        value: document
      - key: MONGO_URI
        value: mongodb://mongodb:27017/battery-passport
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: MINIO_ENDPOINT
        value: http://minio:9000
      - key: MINIO_PUBLIC_URL
        sync: false
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
      - key: MINIO_BUCKET
        value: documents

  - type: web
    name: notification-service
    runtime: docker
    rootDir: services/notification
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "3004"
      - key: NOTIFICATION_PORT
        value: "3004"
      - key: NOTIFICATION_SERVICE_NAME
        value: notification
      - key: KAFKA_BROKER
        value: "kafka:9092"
      - key: SMTP_HOST
        value: mailpit
      - key: SMTP_PORT
        value: "1025"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: noreply@battery-passport.local

  # --- Infrastructure, deployed from existing public images (no Dockerfile) ---
  - type: pserv
    name: mongodb
    runtime: image
    image:
      url: docker.io/library/mongo:7.0.40
    disk:
      name: mongo-data
      mountPath: /data/db
      sizeGB: 1

  - type: pserv
    name: kafka
    runtime: image
    image:
      url: docker.io/apache/kafka:4.3.1
    envVars:
      - key: KAFKA_NODE_ID
        value: "0"
      - key: KAFKA_PROCESS_ROLES
        value: controller,broker
      - key: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: 0@kafka:9093
      - key: KAFKA_LISTENERS
        value: "PLAINTEXT://:9092,CONTROLLER://:9093"
      - key: KAFKA_ADVERTISED_LISTENERS
        value: "PLAINTEXT://kafka:9092"
      - key: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
        value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      - key: KAFKA_CONTROLLER_LISTENER_NAMES
        value: CONTROLLER
      - key: KAFKA_INTER_BROKER_LISTENER_NAME
        value: PLAINTEXT
      - key: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
        value: "1"
      - key: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
        value: "1"
      - key: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
        value: "0"

  # minio is public (type: web), not pserv: presigned download URLs must
  # resolve from a browser, which is exactly what MINIO_PUBLIC_URL needs.
  - type: web
    name: minio
    runtime: image
    image:
      url: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    dockerCommand: server /data --console-address ":9001"
    envVars:
      - key: PORT
        value: "9000"
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 1

  # mailpit is public (type: web) so the web UI (8025) is reachable in a
  # browser; SMTP (1025) stays reachable only over Render's private network,
  # same split as MinIO above.
  - type: web
    name: mailpit
    runtime: image
    image:
      url: docker.io/axllent/mailpit:latest
    envVars:
      - key: PORT
        value: "8025"
